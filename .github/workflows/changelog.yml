name: Generate Changelog

# Runs only when a pull request is MERGED into master (not on every PR push).
on:
  pull_request:
    types: [closed]
    branches: [master]

# Queue runs instead of cancelling, so back-to-back merges each get their own changelog update.
concurrency:
  group: changelog-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changelog:
    # A closed-without-merge PR also fires "closed", so require merged == true.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch PR commits
        run: git fetch origin "pull/${{ github.event.pull_request.number }}/head"

      - name: Generate changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/generate_changelog.py

      - name: Commit changelog to master
        run: |
          if [ -z "$(git status --porcelain Changelogs)" ]; then
            echo "Changelog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Changelogs
          git commit -m "Update changelog for PR #${{ github.event.pull_request.number }} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
